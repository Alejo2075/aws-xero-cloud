name: release
# Tag vX.Y.Z -> verify, build an SBOM, and (only when XERO_PUBLISH=true and NPM_TOKEN is set) publish with provenance.
# Do not enable publishing before the project name/npm scope is decided (see CHANGELOG "Known gaps").
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run: { description: 'Dry run (no publish)', type: boolean, default: true }
permissions:
  contents: write   # attach the SBOM to the release
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --prod --audit-level high
      - name: SBOM (CycloneDX 1.5, production dependencies, generated from pnpm-lock.yaml)
        run: node scripts/gen-sbom.mjs --output sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: sbom, path: sbom.cdx.json }
      - name: Attach SBOM to the GitHub release (tag pushes only)
        if: ${{ github.event_name == 'push' }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            cp sbom.cdx.json "xero-${GITHUB_REF_NAME#v}.cdx.json"
            gh release upload "$GITHUB_REF_NAME" "xero-${GITHUB_REF_NAME#v}.cdx.json"
          else
            echo "::notice::No GitHub release for $GITHUB_REF_NAME yet; the SBOM is available as a workflow artifact."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish
        if: ${{ vars.XERO_PUBLISH == 'true' && (github.event_name == 'push' || inputs.dry_run == false) }}
        run: pnpm -r publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
